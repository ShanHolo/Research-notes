<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 574" role="img" aria-labelledby="token-title token-desc">
  <title id="token-title">One token across two exchanges</title>
  <desc id="token-desc">An earlier saved response contained an issued token. Its value matched byte for byte with the value in a later saved request. The corresponding response returned application records. The credential values are redacted.</desc>
  <defs>
    <marker id="token-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M1 1l8 4-8 4" fill="none" stroke="#237462" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    </marker>
  </defs>
  <style>
    text{font-family:system-ui,"Segoe UI",sans-serif;fill:#152b3c}
    .heading{font-size:36px;font-weight:750;letter-spacing:-.6px}
    .label{font-size:22px;font-weight:740;fill:#1c6455}
    .title{font-size:29px;font-weight:720}
    .note{font-size:24px;fill:#384f5c}
    .icon{fill:none;stroke:#1c6455;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect x="1" y="1" width="638" height="572" rx="20" fill="#f3f8f6" stroke="#c6dad4" stroke-width="2"/>
  <text x="32" y="59" class="heading">One token across two exchanges</text>
  <rect x="32" y="87" width="576" height="119" rx="13" fill="#fff" stroke="#c6dad4" stroke-width="2"/>
  <rect x="50" y="115" width="58" height="58" rx="11" fill="#d8efe8"/>
  <g class="icon" transform="translate(63 128)">
    <path d="M6 5h14l6 6v17H6zM20 5v6h6M11 17h10M11 22h7"/>
  </g>
  <text x="127" y="128" class="label">Earlier saved response</text>
  <text x="127" y="168" class="title">Token issued</text>
  <path d="M79 206v73" fill="none" stroke="#237462" stroke-width="3" marker-end="url(#token-arrow)"/>
  <rect x="100" y="224" width="360" height="42" rx="10" fill="#e0f1e9"/>
  <path d="M116 241h17M116 250h17" class="icon"/>
  <text x="145" y="254" class="label">Same value, byte for byte</text>
  <rect x="32" y="283" width="576" height="119" rx="13" fill="#fff" stroke="#c6dad4" stroke-width="2"/>
  <rect x="50" y="311" width="58" height="58" rx="11" fill="#d8efe8"/>
  <g class="icon" transform="translate(63 324)">
    <circle cx="10" cy="12" r="6"/>
    <path d="M15 16l12 12M20 20l4-4M24 24l4-4"/>
  </g>
  <text x="127" y="324" class="label">Later saved request</text>
  <text x="127" y="364" class="title">Same token present</text>
  <path d="M79 402v44" fill="none" stroke="#237462" stroke-width="3" marker-end="url(#token-arrow)"/>
  <text x="100" y="431" class="label">Response to that request</text>
  <rect x="32" y="450" width="576" height="92" rx="13" fill="#dbeee5" stroke="#b5d7ca" stroke-width="2"/>
  <circle cx="79" cy="496" r="23" fill="#f9fffc"/>
  <path d="M68 496l7 7 15-15" class="icon"/>
  <text x="127" y="507" class="title">Application records returned</text>
</svg>
